<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fred's Bucks — Print Sheet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: white; }
  .page { width: 8.5in; padding: 0.4in; }
  .sheet-header { text-align: center; margin-bottom: 12px; border-bottom: 2px solid #000; padding-bottom: 8px; }
  .brand { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #000; }
  .teacher-line { font-size: 16px; font-weight: 900; color: #000; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .coupon-wrap { position: relative; }
  .coupon-img { width: 100%; display: block; border-radius: 4px; }
  .coupon-overlay { position: absolute; bottom: 12%; left: 3%; }
  .coupon-teacher { font-size: 11px; font-weight: 900; color: #000; text-transform: uppercase; letter-spacing: 1px; background: rgba(255,255,255,0.9); padding: 2px 6px; border-radius: 3px; display: block; margin-bottom: 2px; }
  .coupon-num { font-size: 9px; color: #333; background: rgba(255,255,255,0.9); padding: 1px 6px; border-radius: 3px; display: block; letter-spacing: 0.5px; }
  .footer { text-align: center; margin-top: 10px; font-size: 8px; color: #999; letter-spacing: 1px; text-transform: uppercase; }
  @media print {
    @page { size: letter; margin: 0.3in; }
    body { margin: 0; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="sheet-header">
    <div class="brand">THE COOP by The Hungry Rooster &middot; Fred's Bucks</div>
    <div class="teacher-line" id="teacher-line">Loading...</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">&scissors; cut along edges &middot; one per visit &middot; must present at THE COOP counter &middot; non-transferable &middot; $5 cash value</div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const teacher = params.get('teacher') || 'Teacher Name';
  const ref = params.get('ref') || 'FB-0000';
  const count = parseInt(params.get('count') || '10');

  document.getElementById('teacher-line').innerHTML =
    'Teacher: ' + teacher + '&nbsp;|&nbsp;Ref #' + ref;

  const grid = document.getElementById('grid');
  for (let i = 1; i <= count; i++) {
    const div = document.createElement('div');
    div.className = 'coupon-wrap';
    div.innerHTML =
      '<img class="coupon-img" src="/freds bucks.png" alt="Freds Bucks" />' +
      '<div class="coupon-overlay">' +
        '<span class="coupon-teacher">' + teacher + '</span>' +
        '<span class="coupon-num">' + ref + ' &middot; ' + i + ' of ' + count + '</span>' +
      '</div>';
    grid.appendChild(div);
  }
</script>
</body>
</html>
